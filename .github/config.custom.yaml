# Example Custom Changelog Configuration
#
# This demonstrates how to use a custom config file with the config-path parameter.
# You can copy this file and modify it for your needs.

# Conventional commit types configuration
# This example shows a minimal set of commit types with custom styling
commit_types:
  feat:
    label: "🎉 New Features"
    emoji: "🎉"
    include: true
    order: 1

  fix:
    label: "🔧 Fixes"
    emoji: "🔧"
    include: true
    order: 2

  docs:
    label: "📖 Docs"
    emoji: "📖"
    include: true
    order: 3

  # Exclude some commit types by setting include: false
  style:
    label: "Style Changes"
    emoji: "💎"
    include: false
    order: 4

  refactor:
    label: "Refactoring"
    emoji: "♻️"
    include: false
    order: 5

  perf:
    label: "Performance"
    emoji: "⚡"
    include: true
    order: 6

  test:
    label: "Tests"
    emoji: "✅"
    include: false
    order: 7

  chore:
    label: "Chores"
    emoji: "🔧"
    include: false
    order: 8

  ci:
    label: "CI/CD"
    emoji: "👷"
    include: false
    order: 9

  build:
    label: "Build"
    emoji: "📦"
    include: false
    order: 10

  revert:
    label: "Reverts"
    emoji: "⏪"
    include: true
    order: 11

# Slack message formatting
slack:
  username: "Custom Changelog Bot"
  icon_emoji: ":rocket:"

# Changelog generation settings
changelog:
  include_author: true
  include_date: false  # Hide dates in this custom config
  include_commit_hash: true
  hash_length: 8  # Longer hash than default
  group_by_type: true
  max_commits_per_type: 25  # Limit to 25 commits per type

# First run behavior
first_run:
  lookback_days: 14  # Only look back 2 weeks instead of 30 days
  max_commits: 30  # Limit to 30 commits on first run
